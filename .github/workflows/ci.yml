name: CI

# Package tests, every harness scenario, and the Testbed App's ci:check and smoke test, on each push to main and each pull
# request. See docs/agents/harness.md.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Harness typecheck, Pint, PHPStan rule tests and package analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the monorepo
        uses: ./.github/actions/setup

      - name: Typecheck the harness
        run: pnpm typecheck

      - name: Pint (Composer package)
        run: pnpm lint:php --test

      - name: PHPStan rule tests (Composer package)
        run: pnpm test:php

      - name: PHPStan on the Composer package's own code
        run: pnpm analyse:php

  testbed:
    # The Testbed App (Tracklane on the Base Kit and the Overlay, both packages linked from packages/): its ci:check,
    # then the headless-browser smoke test against a production build. See docs/agents/developing-the-overlay.md.
    name: Testbed App ci:check and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testbed

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The packages' own dependencies (packages/npm/node_modules), which the linked packages resolve from.
      - name: Set up the monorepo
        uses: ./.github/actions/setup

      - name: Install the Testbed App
        run: |
          composer install --no-interaction --no-progress
          pnpm install --frozen-lockfile
          cp .env.example .env
          php artisan key:generate

      - name: ci:check
        run: composer ci:check

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Keyed on the version: each Playwright release pins its own browser builds.
      - name: Restore Playwright's Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image already has the system libraries Chrome needs; --with-deps checks them on a cache miss.
      - name: Install Playwright's Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # What `composer test:smoke` runs, with a Playwright trace kept for each failed test.
      - name: Build
        run: pnpm run build

      - name: Smoke test
        run: php artisan test --testsuite=Browser --trace

      - name: Upload smoke test screenshots, traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testbed-smoke
          path: |
            testbed/tests/Browser/Screenshots
            testbed/tests/Browser/Traces
            testbed/storage/logs/*.log
          if-no-files-found: ignore

  harness:
    # Each shard runs the package tests and its share of the fixture-app tests (STRICTLY_HARNESS_SHARD), dealt out by
    # cost so the shards finish together. Raise the shard count when the suite grows and the shards slow down.
    name: Package tests and harness scenarios (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the monorepo
        uses: ./.github/actions/setup

      - name: Today's date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The latest Base Kit is generated once a day (UTC) and shared by every run and shard that day. The nightly
      # fresh-install job always generates its own.
      - name: Restore today's Base Kit
        id: base-kit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fixtures/.git
            .fixtures/base-kit
            .fixtures/base-kit.stamp.json
          key: base-kit-${{ runner.os }}-${{ steps.today.outputs.date }}-${{ hashFiles('composer.lock', 'harness/src/fixture.ts') }}

      # Without a cached Base Kit, this generates the latest one first.
      - name: Package tests and harness scenarios
        run: pnpm test
        env:
          STRICTLY_HARNESS_SHARD: ${{ matrix.shard }}/8

      - name: Check whether a Base Kit was generated
        id: generated
        if: always() && matrix.shard == 1 && steps.base-kit.outputs.cache-hit != 'true'
        run: test -f .fixtures/base-kit.stamp.json && echo "base-kit=true" >> "$GITHUB_OUTPUT" || true

      - name: Save today's Base Kit
        if: always() && steps.generated.outputs.base-kit == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fixtures/.git
            .fixtures/base-kit
            .fixtures/base-kit.stamp.json
          key: ${{ steps.base-kit.outputs.cache-primary-key }}

      - name: Upload fixture logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-logs-shard-${{ matrix.shard }}
          path: .fixtures/*.log
          # .fixtures/ is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
