name: Set up the monorepo
description: PHP, Composer, Node and pnpm, the monorepo's dependencies, and the git identity the harness's fixture apps commit with.

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: none

    # Reads the version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        cache: pnpm

    # `laravel new --git` and the harness commit inside every fixture app.
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.name "Strictly Laravel CI"
        git config --global user.email "ci@strictly-laravel.invalid"
        git config --global init.defaultBranch main

    - name: Install dependencies
      shell: bash
      run: |
        composer install --no-interaction --no-progress
        pnpm install --frozen-lockfile
